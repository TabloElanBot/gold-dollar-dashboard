<!-- =========================================
     HASINEH MARKET V81
     SECTION 8 — DATA TIMESTAMP ENGINE
========================================= -->

<script>

const HASINEH_TIMESTAMP_ENGINE_V81 = {

  update:function(){

    const target =
      document.getElementById(
        "last-data-update-v81"
      );


    if(!target){

      console.warn(
        "HASINEH V81 timestamp element missing"
      );

      return;

    }


    const now = new Date();


    target.textContent =
      now.toLocaleString("fa-IR",{

        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"

      });

  }

};


/* ---------- INITIAL RUN ---------- */

HASINEH_TIMESTAMP_ENGINE_V81.update();


/* ---------- AUTO REFRESH ---------- */

setInterval(function(){

  HASINEH_TIMESTAMP_ENGINE_V81.update();

},1000);


</script>
