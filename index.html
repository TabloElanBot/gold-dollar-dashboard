<!-- =========================================
     HASINEH MARKET V81
     SECTION 15 — FINAL CONTROL UPGRADE
========================================= -->

<script>

const HASINEH_FINAL_CONTROL_V81 = {

 update:function(){

   const activity =
     document.getElementById(
       "market-activity-v81"
     );


   if(activity){

     const hour =
       new Date().getHours();


     if(hour >= 7 && hour <= 23){

       activity.textContent =
         "🟢 MARKET ACTIVE";

       activity.className =
         "control-value-v81 green-v81";

     }else{

       activity.textContent =
         "🟡 LOW ACTIVITY";

       activity.className =
         "control-value-v81 yellow-v81";

     }

   }



   const summary =
     document.getElementById(
       "system-summary-v81"
     );


   if(summary){

     summary.textContent =
       "🟢 HASINEH MARKET V81 READY";

     summary.className =
       "control-value-v81 green-v81";

   }



   const status =
     document.getElementById(
       "system-status-v81"
     );


   if(status){

     status.textContent =
       "🟢 ACTIVE";

     status.className =
       "control-value-v81 green-v81";

   }


 }


};



/* ---------- START ---------- */

HASINEH_FINAL_CONTROL_V81.update();



/* ---------- AUTO CHECK ---------- */

setInterval(function(){

 HASINEH_FINAL_CONTROL_V81.update();

},30000);


</script>
