<!-- =========================================
     HASINEH MARKET V81
     SECTION 9 — MARKET CONNECTION MONITOR
========================================= -->

<script>

const HASINEH_CONNECTION_MONITOR_V81 = {

  status:function(){

    const target =
      document.getElementById(
        "market-connection-v81"
      );


    if(!target){

      console.warn(
        "HASINEH V81 connection element missing"
      );

      return;

    }


    /* ---------- CONNECTION STATUS ---------- */

    let connected = true;


    if(connected){

      target.textContent =
        "🟢 CONNECTED";

      target.className =
        "control-value-v81 green-v81";


    }else{

      target.textContent =
        "🔴 DISCONNECTED";

      target.className =
        "control-value-v81 red-v81";

    }

  }

};


/* ---------- INITIAL CHECK ---------- */

HASINEH_CONNECTION_MONITOR_V81.status();


/* ---------- AUTO CHECK ---------- */

setInterval(function(){

  HASINEH_CONNECTION_MONITOR_V81.status();

},15000);


</script>
