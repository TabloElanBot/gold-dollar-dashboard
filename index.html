<!-- =========================================
     HASINEH MARKET V81
     SECTION 10 — IRAN MARKET CLOCK ENGINE
========================================= -->

<script>

const HASINEH_IRAN_CLOCK_V81 = {

  update:function(){

    const clock =
      document.getElementById(
        "iran-time-v81"
      );


    if(!clock){

      console.warn(
        "HASINEH V81 Iran clock element missing"
      );

      return;

    }


    const now =
      new Date();


    clock.textContent =
      now.toLocaleTimeString(
        "fa-IR",
        {
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        }
      );


  }

};


/* ---------- INITIAL START ---------- */

HASINEH_IRAN_CLOCK_V81.update();


/* ---------- LIVE CLOCK ---------- */

setInterval(function(){

  HASINEH_IRAN_CLOCK_V81.update();

},1000);


</script>
