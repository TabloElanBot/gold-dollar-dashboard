<!-- =========================================
     HASINEH MARKET V81
     SECTION 7 — LIVE MARKET PULSE
========================================= -->

<script>

const HASINEH_MARKET_PULSE_V81 = {

  lastSnapshot: null,

  update:function(){

    const pulse =
      document.getElementById("market-pulse-v81");

    if(!pulse){

      console.warn(
        "HASINEH V81: market-pulse-v81 not found"
      );

      return;

    }


    const now = new Date();


    /* ---------- MARKET PULSE ---------- */

    const snapshot = {

      time:
        now.toLocaleTimeString("fa-IR",{
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        }),

      timestamp:
        now.getTime()

    };


    /* ---------- DETECT MARKET ACTIVITY ---------- */

    let status = "🟢 MARKET ACTIVE";
    let statusClass = "green-v81";


    if(
      this.lastSnapshot &&
      snapshot.timestamp === this.lastSnapshot.timestamp
    ){

      status = "🟡 STABLE";
      statusClass = "yellow-v81";

    }


    pulse.textContent = status;
    pulse.className =
      "control-value-v81 " + statusClass;


    this.lastSnapshot = snapshot;

  }

};


/* ---------- INITIAL UPDATE ---------- */

HASINEH_MARKET_PULSE_V81.update();


/* ---------- PERIODIC UPDATE ---------- */

setInterval(function(){

  HASINEH_MARKET_PULSE_V81.update();

},10000);

</script>
