<!DOCTYPE html>
<html>
<head>
<title>HASINEH MARKET</title>

<style>
body {
  margin:0;
  background:#050505;
  color:white;
  font-family:Tahoma, Arial, sans-serif;
  text-align:center;
}

.header {
  padding:25px 10px;
  background:#111;
  border-bottom:3px solid gold;
}

.logo {
  font-size:38px;
  color:gold;
  font-weight:bold;
}

.market {
  color:#00ff88;
  margin-top:10px;
}

.time {
  color:#aaa;
  margin-top:8px;
}

.container {
  padding:15px;
}

.card {
  background:#151515;
  margin:15px 0;
  padding:20px;
  border-radius:18px;
  border:1px solid #333;
}

.title {
  color:gold;
  font-size:25px;
  margin-bottom:15px;
}

.item {
  display:flex;
  justify-content:space-between;
  padding:12px 5px;
  border-bottom:1px solid #333;
  font-size:19px;
}

.price {
  color:white;
}

.up {
  color:#00ff88;
}

.down {
  color:#ff4444;
}

.wait {
  color:#aaa;
}

.footer {
  padding:20px;
  color:#777;
}

</style>

</head>

<body>

<div class="header">

<div class="logo">
HASINEH MARKET
</div>

<div class="market">
● بازار فعال
</div>

<div class="time" id="clock">
در حال دریافت زمان...
</div>

</div>


<div class="container">


<div class="card">

<div class="title">
🟡 HASINEH GOLD
</div>

<div class="item">
<span>طلای ۱۸ عیار</span>
<span class="price">---</span>
</div>

<div class="item">
<span>مثقال طلا</span>
<span class="price">---</span>
</div>

<div class="item">
<span>طلای ۲۴ عیار</span>
<span class="price">---</span>
</div>

</div>



<div class="card">

<div class="title">
💵 HASINEH CURRENCY
</div>

<div class="item">
<span>دلار</span>
<span class="price">---</span>
</div>

<div class="item">
<span>یورو</span>
<span class="price">---</span>
</div>

</div>



<div class="card">

<div class="title">
🚗 HASINEH AUTO
</div>

<div class="item">
<span>بازار خودرو</span>
<span class="wait">بزودی</span>
</div>

</div>



<div class="card">

<div class="title">
🏠 HASINEH REAL ESTATE
</div>

<div class="item">
<span>بازار ملک</span>
<span class="wait">بزودی</span>
</div>

</div>


</div>


<div class="footer">
HASINEH MARKET © 2026
</div>


<script>
function updateClock(){
 let now = new Date();
 document.getElementById("clock").innerHTML =
 "آخرین بروزرسانی: " + now.toLocaleString("fa-IR");
}

setInterval(updateClock,1000);
updateClock();
</script>


</body>
</html>
