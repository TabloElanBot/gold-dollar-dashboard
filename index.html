<!-- =========================================
     HASINEH MARKET V81
     SECTION 5 — ENGINE SYNCHRONIZATION
========================================= -->

<script>

const HASINEH_V81_CORE = {

  start:function(){

    /* ---------- RUN TIME ENGINE ---------- */

    if(
      typeof HASINEH_TIME_ENGINE_V81 !== "undefined" &&
      HASINEH_TIME_ENGINE_V81.update
    ){
      HASINEH_TIME_ENGINE_V81.update();
    }


    /* ---------- RUN STATUS ENGINE ---------- */

    if(
      typeof HASINEH_STATUS_ENGINE_V81 !== "undefined" &&
      HASINEH_STATUS_ENGINE_V81.update
    ){
      HASINEH_STATUS_ENGINE_V81.update();
    }


    /* ---------- SYSTEM READY ---------- */

    const system =
      document.getElementById("system-status-v81");

    if(system){

      system.textContent = "🟢 ACTIVE";
      system.className =
        "control-value-v81 green-v81";
    }

  }

};


/* ---------- SAFE START ---------- */

if(document.readyState === "loading"){

  document.addEventListener(
    "DOMContentLoaded",
    function(){
      HASINEH_V81_CORE.start();
    }
  );

}else{

  HASINEH_V81_CORE.start();

}

</script>
