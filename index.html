<!-- =========================================
     HASINEH MARKET V81
     SECTION 11 — SOLAR DATE ENGINE
========================================= -->

<script>

const HASINEH_SOLAR_DATE_V81 = {

  update:function(){

    const target =
      document.getElementById(
        "solar-date-v81"
      );


    if(!target){

      console.warn(
        "HASINEH V81 solar date element missing"
      );

      return;

    }


    const now =
      new Date();


    target.textContent =
      now.toLocaleDateString(
        "fa-IR",
        {

          year:"numeric",
          month:"long",
          day:"numeric"

        }
      );


  }

};


/* ---------- INITIAL UPDATE ---------- */

HASINEH_SOLAR_DATE_V81.update();


/* ---------- DAILY REFRESH ---------- */

setInterval(function(){

  HASINEH_SOLAR_DATE_V81.update();

},60000);


</script>
