<!-- =========================================
     HASINEH MARKET V81
     SECTION 6 — SYSTEM HEALTH MONITOR
========================================= -->

<script>

const HASINEH_HEALTH_MONITOR_V81 = {

  check:function(){

    let systemOK = true;


    /* ---------- CHECK CONTROL CENTER ---------- */

    const requiredElements = [

      "system-status-v81",
      "data-engine-v81",
      "market-connection-v81",
      "last-data-update-v81",
      "data-source-v81",
      "iran-time-v81",
      "solar-date-v81",
      "lunar-date-v81"

    ];


    requiredElements.forEach(function(id){

      const element =
        document.getElementById(id);

      if(!element){

        systemOK = false;

        console.warn(
          "HASINEH V81 missing element:",
          id
        );

      }

    });


    /* ---------- UPDATE SYSTEM STATUS ---------- */

    const system =
      document.getElementById("system-status-v81");

    if(system){

      if(systemOK){

        system.textContent = "🟢 ACTIVE";
        system.className =
          "control-value-v81 green-v81";

      }else{

        system.textContent = "🟡 PARTIAL";
        system.className =
          "control-value-v81 yellow-v81";

      }

    }


    return systemOK;

  }

};


/* ---------- START HEALTH MONITOR ---------- */

HASINEH_HEALTH_MONITOR_V81.check();


/* ---------- PERIODIC CHECK ---------- */

setInterval(function(){

  HASINEH_HEALTH_MONITOR_V81.check();

},10000);

</script>
