<!-- =========================================
     HASINEH MARKET V81
     SECTION 3 — IRAN TIME & DATE ENGINE
========================================= -->

<script>

const HASINEH_TIME_ENGINE_V81 = {

  update:function(){

    const now = new Date();

    /* ---------- IRAN TIME ---------- */

    const iranTime =
      now.toLocaleTimeString(
        "fa-IR",
        {
          timeZone:"Asia/Tehran",
          hour:"2-digit",
          minute:"2-digit",
          second:"2-digit"
        }
      );

    const timeElement =
      document.getElementById("iran-time-v81");

    if(timeElement){
      timeElement.textContent = iranTime;
    }


    /* ---------- SOLAR DATE ---------- */

    const solarDate =
      now.toLocaleDateString(
        "fa-IR-u-ca-persian",
        {
          timeZone:"Asia/Tehran",
          year:"numeric",
          month:"long",
          day:"numeric"
        }
      );

    const solarElement =
      document.getElementById("solar-date-v81");

    if(solarElement){
      solarElement.textContent = solarDate;
    }


    /* ---------- LUNAR DATE ---------- */

    const lunarDate =
      now.toLocaleDateString(
        "ar-SA-u-ca-islamic",
        {
          timeZone:"Asia/Tehran",
          year:"numeric",
          month:"long",
          day:"numeric"
        }
      );

    const lunarElement =
      document.getElementById("lunar-date-v81");

    if(lunarElement){
      lunarElement.textContent = lunarDate;
    }

  }

};


/* ---------- START ENGINE ---------- */

HASINEH_TIME_ENGINE_V81.update();


/* ---------- LIVE CLOCK ---------- */

setInterval(function(){

  HASINEH_TIME_ENGINE_V81.update();

},1000);

</script>
