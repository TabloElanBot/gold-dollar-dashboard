<!-- =========================================
     HASINEH MARKET V81
     SECTION 15 — MARKET ACTIVITY INDICATOR
========================================= -->

<script>

const HASINEH_ACTIVITY_INDICATOR_V81 = {

  update:function(){

    const target =
      document.getElementById(
        "market-activity-v81"
      );


    if(!target){

      console.warn(
        "HASINEH V81 market activity element missing"
      );

      return;

    }


    const hour =
      new Date().getHours();


    let status =
      "🟢 ACTIVE";


    let className =
      "green-v81";


    if(hour < 7 || hour > 23){

      status =
        "🟡 LOW ACTIVITY";

      className =
        "yellow-v81";

    }


    target.textContent =
      status;


    target.className =
      "control-value-v81 " + className;


  }

};


/* ---------- INITIAL UPDATE ---------- */

HASINEH_ACTIVITY_INDICATOR_V81.update();


/* ---------- AUTO UPDATE ---------- */

setInterval(function(){

  HASINEH_ACTIVITY_INDICATOR_V81.update();

},60000);


</script>
