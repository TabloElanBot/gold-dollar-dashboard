name: HASINEH PRICE ENGINE TEST

on:
  workflow_dispatch:
  push:

jobs:
  test-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python Test
        run: |
          python --version
          echo "Python is working"

      - name: File Test
        run: |
          echo "Checking engine file..."
          test -f price-engine/test_engine.py
          echo "Engine file exists"

      - name: Run Engine
        run: |
          echo "Starting HASINEH PRICE ENGINE..."
          python price-engine/test_engine.py
          echo "ENGINE FINISHED SUCCESSFULLY"
