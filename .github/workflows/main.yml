name: HASINEH PRICE ENGINE TEST

on:
  workflow_dispatch:
  push:
    paths:
      - "price-engine/**"

jobs:
  test-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run Price Engine Test
        run: python -u price-engine/test_engine.py
        continue-on-error: false
